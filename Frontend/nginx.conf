# Servidor de estaticos del Frontend (build de Vite) para nginx-unprivileged.
# Se copia a /etc/nginx/conf.d/default.conf (contexto http).

# S4 (R-013): las respuestas de la API no se guardan en cache (datos personales).
# Valor vacio = nginx no anade la cabecera.
map $uri $cache_control_api {
    ~^/api/  "no-store";
    default  "";
}

# S1 (R-013): servidor por defecto. Cualquier Host que no sea el propio equipo (DNS
# rebinding: http://atacante.tld:8080 re-resuelto a 127.0.0.1) se corta sin respuesta.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    server_tokens off;

    return 444;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost 127.0.0.1;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Por defecto el cuerpo esta limitado a 1 MB; solo las cargas admiten 6 MB (S9).
    client_max_body_size 1m;

    # Cabeceras de seguridad. No se usa add_header dentro de los location para que se
    # hereden todas (un add_header en un location anula las del server).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # S4 (R-013): el build de Vite solo usa scripts, estilos y fuentes propios; las imagenes
    # data:/blob: cubren iconos en linea y la descarga del Excel (URL.createObjectURL).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $cache_control_api always;

    # Proxy a la API. El host "backend" solo existe en la red de compose (T16).
    # Se resuelve en tiempo de peticion con el DNS interno de Docker para que
    # nginx arranque aunque el host no exista (fuera de compose responde 502).
    # Nivel server: asi tambien aplica al location anidado de cargas.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Health check del contenedor.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # S1: Host con puerto tal como lo envio el navegador (solo localhost/127.0.0.1 llegan
        # aqui): el backend lo valida (HOSTS_PERMITIDOS) y lo compara con Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx es el borde: se descarta cualquier X-Forwarded-For del cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # S9 (R-013): solo la carga de plantillas (<= 5 MB en el backend) admite 6 MB.
        # Hereda los proxy_set_header de /api/.
        location /api/v1/cargas {
            client_max_body_size 6m;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
        }
    }

    # Assets con hash de Vite: si no existe, 404 (no se enmascara un chunk roto
    # con index.html). Sin add_header propio: hereda las cabeceras de seguridad.
    location /assets/ {
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta que no sea un archivo sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
