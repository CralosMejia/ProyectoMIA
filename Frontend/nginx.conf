# Servidor de estaticos del Frontend (build de Vite) para nginx-unprivileged.
# Se copia a /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad basicas. No se repiten add_header en los
    # location para que se hereden.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Health check del contenedor.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proxy a la API. El host "backend" solo existe en la red de compose (T16).
    # Se resuelve en tiempo de peticion con el DNS interno de Docker para que
    # nginx arranque aunque el host no exista (fuera de compose responde 502).
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx es el borde: se descarta cualquier X-Forwarded-For del cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash de Vite: si no existe, 404 (no se enmascara un chunk roto
    # con index.html). Sin add_header propio: hereda las cabeceras de seguridad.
    location /assets/ {
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta que no sea un archivo sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
