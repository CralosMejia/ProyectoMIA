[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Backend API (FastAPI, Clean Architecture)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "import-linter>=2.1,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "DTZ", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: pruebas sin FastAPI ni base de datos (domain, application)",
    "integration: pruebas con base de datos real (infrastructure, api)",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Capas: api > infrastructure > application > domain"
type = "layers"
containers = ["app"]
layers = ["api", "infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "domain no importa ninguna otra capa"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.application",
    "app.infrastructure",
    "app.core",
    "app.main",
]

[[tool.importlinter.contracts]]
name = "core no importa ninguna capa de la aplicacion"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.api",
    "app.application",
    "app.infrastructure",
    "app.main",
]

[[tool.importlinter.contracts]]
name = "application no importa api ni infrastructure"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.api", "app.infrastructure", "app.main"]

[[tool.importlinter.contracts]]
name = "infrastructure no importa api"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "api no importa infrastructure (salvo composition root)"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.infrastructure"]
# Unico composition root dentro de app.api. app.main no pertenece a app.api.
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    "app.api.dependencies -> app.infrastructure.**",
]
